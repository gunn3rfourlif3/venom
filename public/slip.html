<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xnith — Result slips</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<!--
  The marshal's capture page.

  Deliberately self-contained and small: this loads at 23:00, on mobile data,
  outside a hall, on whatever phone the marshal owns. It does not pull in
  app.css (1,700 lines of dashboard) or any library.

  The page's real job is not taking a photograph — a phone already does that.
  It is making unmissable that a station produces TWO slips in a metro and
  THREE in a local municipality. A marshal who photographs the ward slip and
  walks away has done a third of the work, and before this screen existed the
  system would have called that station complete.
-->
<style>
  :root {
    --paper: #0a0a0d;
    --surface: #15151b;
    --rule: #2a2a33;
    --ink: #f2f2f5;
    --ink-2: #a0a0ad;
    --ours: #f5c518;
    --done: #34d399;
    --warn: #fb923c;
    --r: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
    /* 16px is the smallest size iOS will not zoom on focus. Below it, tapping
       a field jumps the layout, which on a dark street is disorienting. */
  }
  h1 { font-size: 1.05rem; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--ink-2); font-size: .875rem; margin: 0 0 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--r); padding: 14px; margin-bottom: 12px;
  }
  label { display: block; font-size: .8125rem; color: var(--ink-2); margin-bottom: 6px; }
  input[type=search], input[type=text] {
    width: 100%; font-size: 16px; padding: 12px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); border-radius: var(--r);
  }
  input:focus { outline: none; border-color: var(--ours); }

  .station { padding: 13px 12px; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .station:last-child { border-bottom: 0; }
  .station b { display: block; font-variant-numeric: tabular-nums; }
  .station span { color: var(--ink-2); font-size: .8125rem; }

  /* Tap targets are 52px minimum. A marshal is holding a phone in one hand,
     in the dark, possibly in rain. */
  .btn {
    display: block; width: 100%; min-height: 52px;
    font-size: 1rem; font-weight: 600; font-family: inherit;
    border: 0; border-radius: var(--r); cursor: pointer;
    background: var(--ours); color: #1a1500;
  }
  .btn[disabled] { opacity: .5; }
  .btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--rule); }

  /* Name and status on one line, the button full width beneath it. Sharing a
     row squeezed the name to about 160px on a 390px phone, which broke
     "Municipal PR ballot" across two lines mid-phrase — and left a button
     narrower than a thumb. Full width is both easier to read and easier to
     hit one-handed in the dark. */
  .ballot {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 12px;
    align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
  }
  .ballot .shoot { grid-column: 1 / -1; width: 100%; }
  .ballot:last-child { border-bottom: 0; }
  .ballot-name { flex: 1; font-weight: 600; }
  .ballot-name small { display: block; font-weight: 400; color: var(--ink-2); font-size: .8125rem; }
  .pill {
    font-size: .6875rem; letter-spacing: .06em; padding: 4px 9px;
    border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
  }
  .pill.todo { color: var(--warn); }
  .pill.done { color: var(--done); }
  .shoot {
    min-height: 50px; font-size: .9375rem; font-weight: 600;
    border: 0; border-radius: var(--r); background: var(--ours); color: #1a1500;
    font-family: inherit; cursor: pointer;
  }
  .shoot.is-done { background: transparent; color: var(--done); border: 1px solid var(--done); }
  .shoot[disabled] { opacity: .55; }

  .banner { border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; font-size: .9375rem; }
  .banner.warn { border: 1px solid var(--warn); color: var(--warn); background: rgba(251,146,60,.08); }
  .banner.good { border: 1px solid var(--done); color: var(--done); background: rgba(52,211,153,.08); }
  .banner.bad  { border: 1px solid #f87171; color: #f87171; background: rgba(248,113,113,.08); }
  .hide { display: none !important; }
  canvas { display: none; }
</style>
</head>
<body>

<h1>Result slips</h1>
<p class="sub" id="who">Checking your link…</p>

<div id="msg"></div>

<!-- Step 1 — which station -->
<section class="card hide" id="pick">
  <label for="q">Find your station</label>
  <input type="search" id="q" inputmode="numeric" autocomplete="off"
         placeholder="Booth number or name">
  <div id="results" style="margin-top:6px"></div>
</section>

<!-- Step 2 — the ballots that station must produce -->
<section class="card hide" id="shoot">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
    <div>
      <b id="st-id" style="font-variant-numeric:tabular-nums"></b>
      <div class="sub" id="st-name" style="margin:2px 0 0"></div>
    </div>
    <button class="btn-ghost" id="change"
            style="min-height:36px;padding:0 12px;border-radius:8px;font-size:.8125rem;cursor:pointer">Change</button>
  </div>

  <div class="banner warn" id="count-note" style="margin-top:14px"></div>
  <div id="ballots"></div>
</section>

<input type="file" id="file" accept="image/*" capture="environment" class="hide">
<canvas id="cv"></canvas>

<script>
/* The token arrives in the URL FRAGMENT, not the query string. A fragment is
   never sent to the server, so it cannot appear in access logs, and it is not
   forwarded in a Referer header if the marshal ever taps an outbound link.
   It is read once and then cleared from the address bar, so the credential is
   not left sitting in a shared phone's history in plain view. */
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('t') || '';
if (TOKEN) history.replaceState(null, '', location.pathname);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const BALLOT_LABEL = {
  WARD:         ['Ward ballot',          'The councillor for this ward'],
  PR_MUNICIPAL: ['Municipal PR ballot',  'The party vote for this council'],
  PR_DISTRICT:  ['District PR ballot',   'The party vote for the district council'],
};

let station = null;      // the chosen station row
let pending = null;      // which ballot the camera was opened for

function say(kind, html) {
  $('msg').innerHTML = html ? `<div class="banner ${kind}">${html}</div>` : '';
}

/* ---------------------------------------------------------------------------
   Downscale before upload.

   A modern phone produces 3-8MB per photograph. The server refuses anything
   over 2.5MB, and on a rural data connection at 23:00 a 6MB upload may simply
   never finish. A result slip is large print on white paper: 1600px on the
   long edge reads perfectly and lands around 300KB.

   imageOrientation:'from-image' applies the EXIF rotation tag. Without it,
   slips photographed in portrait arrive on their side, and an operator
   transcribing at 02:00 has to tilt their head to read every one.
--------------------------------------------------------------------------- */
async function shrink(file) {
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' })
    .catch(() => createImageBitmap(file));
  const max = 1600;
  const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);

  const cv = $('cv');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();

  /* Step the quality down until it fits. A slip photographed against a busy
     background can still be large at 0.8, and a fixed quality that usually
     works is the kind of thing that fails on the one night it matters. */
  for (const q of [0.8, 0.65, 0.5, 0.4]) {
    const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', q));
    if (blob && blob.size <= 2_400_000) return blob;
  }
  return null;
}

const toBase64 = (blob) => new Promise((resolve, reject) => {
  const fr = new FileReader();
  fr.onload = () => resolve(String(fr.result).split(',')[1]);
  fr.onerror = reject;
  fr.readAsDataURL(blob);
});

/* --------------------------------------------------------------------------- */

async function loadStations(q) {
  const url = `/api/slip/stations?token=${encodeURIComponent(TOKEN)}`
            + (q ? `&q=${encodeURIComponent(q)}` : '');
  const res = await fetch(url);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Could not reach Xnith.');
  return body.data;
}

function renderResults(rows) {
  if (rows.length === 0) {
    $('results').innerHTML = '<p class="sub" style="margin:10px 0 0">No station matches that.</p>';
    return;
  }
  $('results').innerHTML = rows.map((r, i) => `
    <div class="station" data-i="${i}">
      <b>${esc(r.station_id)}</b>
      <span>${esc(r.name)} — ${esc(r.municipality)}</span>
    </div>`).join('');
  $('results').querySelectorAll('.station').forEach((el) => {
    el.addEventListener('click', () => choose(rows[Number(el.dataset.i)]));
  });
}

function choose(row) {
  station = row;
  $('pick').classList.add('hide');
  $('shoot').classList.remove('hide');
  $('st-id').textContent = row.station_id;
  $('st-name').textContent = `${row.name} — ${row.municipality}`;
  renderBallots();
}

function renderBallots() {
  const done = new Set(station.done || []);
  const total = station.ballots.length;
  const left = total - station.ballots.filter((b) => done.has(b)).length;

  /* This sentence is the entire reason the screen exists. It states the
     number BEFORE the list, because a marshal who reads one line reads the
     first one. */
  const note = $('count-note');
  if (left === 0) {
    note.className = 'banner good';
    note.textContent = `All ${total} slips received for this station. Thank you.`;
  } else {
    note.className = 'banner warn';
    note.textContent = total === 3
      ? `This station has THREE ballots. ${left} still to photograph.`
      : `This station has ${total} ballots. ${left} still to photograph.`;
  }

  $('ballots').innerHTML = station.ballots.map((b) => {
    const [name, hint] = BALLOT_LABEL[b] || [b, ''];
    const is = done.has(b);
    return `<div class="ballot">
      <div class="ballot-name">${esc(name)}<small>${esc(hint)}</small></div>
      <span class="pill ${is ? 'done' : 'todo'}">${is ? 'RECEIVED' : 'NEEDED'}</span>
      <button class="shoot ${is ? 'is-done' : ''}" data-b="${b}">${is ? 'Retake' : 'Photograph'}</button>
    </div>`;
  }).join('');

  $('ballots').querySelectorAll('.shoot').forEach((el) => {
    el.addEventListener('click', () => { pending = el.dataset.b; $('file').click(); });
  });
}

$('file').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';                       // so the same file can be re-picked
  if (!file || !pending) return;

  const buttons = $('ballots').querySelectorAll('.shoot');
  buttons.forEach((b) => (b.disabled = true));
  say('', '');

  try {
    const blob = await shrink(file);
    if (!blob) throw new Error('That photograph is too large even after shrinking. Try again, closer in.');

    const res = await fetch('/api/slip', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        token: TOKEN,
        stationId: station.station_id,
        ballot: pending,
        image: await toBase64(blob),
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'Upload failed.');

    const [label] = BALLOT_LABEL[pending] || [pending];
    say('good', body.data.duplicate
      ? `${esc(label)} was already received. Nothing sent twice.`
      : `${esc(label)} received.`);

    station.done = Array.from(new Set([...(station.done || []), pending]));
    renderBallots();
  } catch (err) {
    /* The message says what to do, not what went wrong internally. A marshal
       cannot act on a stack trace, and "try again" with no retained state
       would mean re-photographing — so the button stays where it was. */
    say('bad', esc(err.message) + ' Your other slips are safe — try this one again.');
    renderBallots();
  } finally {
    pending = null;
  }
});

$('change').addEventListener('click', () => {
  station = null;
  $('shoot').classList.add('hide');
  $('pick').classList.remove('hide');
  $('q').value = '';
  $('results').innerHTML = '';
  say('', '');
  start();
});

let timer;
$('q').addEventListener('input', (e) => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  timer = setTimeout(async () => {
    if (q.length < 2) { $('results').innerHTML = ''; return; }
    try { renderResults((await loadStations(q)).stations); }
    catch (err) { say('bad', esc(err.message)); }
  }, 250);
});

async function start() {
  if (!TOKEN) {
    $('who').textContent = '';
    say('bad', 'This page needs the personal link you were sent. Open that link again.');
    return;
  }
  try {
    const data = await loadStations('');
    $('who').textContent = `Signed in as ${data.marshal}`;
    if (data.stations.length === 1) {
      choose(data.stations[0]);           // assigned station: skip the search
    } else {
      $('pick').classList.remove('hide');
    }
  } catch (err) {
    $('who').textContent = '';
    say('bad', esc(err.message));
  }
}

start();
</script>
</body>
</html>
